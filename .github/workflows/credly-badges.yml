name: Update Credly badges

# Set your Credly username once: Settings > Secrets and variables > Actions >
# Variables > New repository variable  CREDLY_USER = <id from credly.com/users/<id>>
on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: credly
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refresh badge section in README.md
        env:
          CREDLY_USER: ${{ vars.CREDLY_USER }}
        run: python3 .github/scripts/update_credly_badges.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Badges unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Credly badges"
          git push
