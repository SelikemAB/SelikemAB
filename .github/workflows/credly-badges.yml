name: Update Credly badges

# Credly profile: https://www.credly.com/users/selikemab/badges
# (override with a repository variable CREDLY_USER if the username changes)
on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:
  push:                    # populate right after this workflow/script lands on main
    branches:
      - main
    paths:
      - ".github/workflows/credly-badges.yml"
      - ".github/scripts/update_credly_badges.py"

permissions:
  contents: write

concurrency:
  group: credly
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refresh badge section in README.md
        env:
          CREDLY_USER: ${{ vars.CREDLY_USER || 'selikemab' }}
        run: python3 .github/scripts/update_credly_badges.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Badges unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Credly badges"
          git pull --rebase origin main
          git push origin HEAD:main
